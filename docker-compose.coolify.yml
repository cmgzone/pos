services:
  piki-web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Use the internal URL from the Coolify PostgreSQL resource}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      REDIS_URL: ${REDIS_URL:?Use the internal URL from the Coolify Redis resource}
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-30}
      LICENSE_SIGNING_PRIVATE_KEY: ${LICENSE_SIGNING_PRIVATE_KEY:?Set the Ed25519 private key (base64 raw seed) used to sign licenses}
      LICENSE_SIGNING_PUBLIC_KEY: ${LICENSE_SIGNING_PUBLIC_KEY:?Set the Ed25519 public key (base64 raw) that ships in the app}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?}
      PLATFORM_ALLOWED_ORIGINS: ${PLATFORM_ALLOWED_ORIGINS:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set this to the public HTTPS backend origin, for example https://pikipos.com}
      PUBLIC_CATALOG_ROOT_DOMAIN: ${PUBLIC_CATALOG_ROOT_DOMAIN:-pikipos.com}
      SUBSCRIPTION_TRIAL_DAYS: ${SUBSCRIPTION_TRIAL_DAYS:-30}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-5}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_BASE_URL: ${RESEND_API_BASE_URL:-https://api.resend.com}
      OTP_FROM_EMAIL: ${OTP_FROM_EMAIL:-Piki POS <otp@notify.pikipos.com>}
      EMAIL_OTP_REQUIRED: ${EMAIL_OTP_REQUIRED:-true}
      EMAIL_OTP_SECRET: ${EMAIL_OTP_SECRET:-}
      EMAIL_OTP_TTL_MINUTES: ${EMAIL_OTP_TTL_MINUTES:-10}
      EMAIL_OTP_COOLDOWN_SECONDS: ${EMAIL_OTP_COOLDOWN_SECONDS:-60}
      EMAIL_OTP_MAX_ATTEMPTS: ${EMAIL_OTP_MAX_ATTEMPTS:-5}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@pikipos.com}
      LANDING_CONTACT_NOTIFY_EMAIL: ${LANDING_CONTACT_NOTIFY_EMAIL:-support@pikipos.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.zoho.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-support@pikipos.com}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-Piki POS <support@pikipos.com>}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE:-}
      BUNNY_STORAGE_ACCESS_KEY: ${BUNNY_STORAGE_ACCESS_KEY:-}
      BUNNY_STORAGE_REGION: ${BUNNY_STORAGE_REGION:-}
      BUNNY_STORAGE_ENDPOINT: ${BUNNY_STORAGE_ENDPOINT:-}
      BUNNY_CDN_BASE_URL: ${BUNNY_CDN_BASE_URL:-}
      BUNNY_UPLOAD_PATH: ${BUNNY_UPLOAD_PATH:-product-images}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.piki.pos}
      GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.paypal.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      FLUTTERWAVE_BASE_URL: ${FLUTTERWAVE_BASE_URL:-https://api.flutterwave.com/v3}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_CLIENT_ID: ${FLUTTERWAVE_CLIENT_ID:-}
      FLUTTERWAVE_CLIENT_SECRET: ${FLUTTERWAVE_CLIENT_SECRET:-}
      FLUTTERWAVE_ENCRYPTION_KEY: ${FLUTTERWAVE_ENCRYPTION_KEY:-}
      FLUTTERWAVE_WEBHOOK_SECRET_HASH: ${FLUTTERWAVE_WEBHOOK_SECRET_HASH:-}
      MPESA_BASE_URL: ${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:-}
      PAYMENT_SECRETS_ENCRYPTION_KEY: ${PAYMENT_SECRETS_ENCRYPTION_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      APP_LATEST_VERSION: ${APP_LATEST_VERSION:-}
      APP_MINIMUM_VERSION: ${APP_MINIMUM_VERSION:-}
      APP_APK_URL: ${APP_APK_URL:-}
      APP_ANDROID_VERSION: ${APP_ANDROID_VERSION:-}
      APP_ANDROID_MINIMUM_VERSION: ${APP_ANDROID_MINIMUM_VERSION:-}
      APP_ANDROID_URL: ${APP_ANDROID_URL:-}
      APP_WINDOWS_VERSION: ${APP_WINDOWS_VERSION:-}
      APP_WINDOWS_MINIMUM_VERSION: ${APP_WINDOWS_MINIMUM_VERSION:-}
      APP_WINDOWS_URL: ${APP_WINDOWS_URL:-}
      APP_RELEASE_NOTES: ${APP_RELEASE_NOTES:-}
      APP_RELEASE_DIR: ${APP_RELEASE_DIR:-/app/backend/app-releases}
      APP_RELEASE_MAX_BYTES: ${APP_RELEASE_MAX_BYTES:-314572800}
    ports:
      - "3000:3000"
    volumes:
      - piki_app_releases:/app/backend/app-releases
    restart: unless-stopped
    labels:
      # Allow large APK/installer uploads (300MB) through Traefik
      - "traefik.http.middlewares.piki-web-buffer.buffering.maxRequestBodyBytes=314572800"
      - "traefik.http.middlewares.piki-web-buffer.buffering.memRequestBodyBytes=104857600"
      # Long timeouts for large file uploads and downloads
      - "traefik.http.services.piki-web.loadbalancer.server.responseForwarding.flushInterval=100ms"

volumes:
  piki_app_releases:
