server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large app release uploads (APK / Windows installers).
    # Must be >= backend APP_RELEASE_MAX_BYTES (default 300MB).
    client_max_body_size 350m;

    # App release uploads: stream straight to the backend with long timeouts
    # so big APK/EXE/MSI/ZIP files don't get buffered or cut off.
    location /api/platform/app-release/ {
        resolver 127.0.0.11 valid=30s;
        set $backend "BACKEND_URL_PLACEHOLDER";

        proxy_pass $backend/api/platform/app-release/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # Proxy all other /api requests to the backend
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend "BACKEND_URL_PLACEHOLDER";
        
        proxy_pass $backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Serve React app - all routes go to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
